name: resistome
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  - pandas
  - numpy
  - scikit-learn
  - matplotlib
  - seaborn
  - biopython
  - diamond
  - ncbi-blast
  - prodigal
  - megahit
  - fastqc
  - sra-tools
  # --- Paper 1 three-pipeline ARG quantification ---
  - fastp          # read QC/trimming
  - bowtie2        # Pipeline B: read mapping to CARD
  - samtools       # BAM handling + idxstats for Pipeline B
  - rgi            # Pipeline C: strict CARD resistance calls (RGI)
  - statsmodels    # variance decomposition
  - scipy          # Spearman concordance
